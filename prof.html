<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1f2a44"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Prof Step"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Espace prof Step 1re</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<style>
/* Mise en page : poste de pilotage de l'enseignant — QR à projeter, puis tableau de classe dense, détail élève en une colonne. Même charte que le carnet. */
:root {
  --bg: #eef2f5; --surface: #ffffff; --surface-2: #f6f9fb; --line: #d3dce4; --ink: #18222f; --muted: #5a6878;
  --nuit: #1f2a44; --nuit-ink: #ffffff; --canard: #0d7480; --canard-ink: #ffffff; --canard-pale: #d9eef0;
  --t1: #d9574a; --t1-bg: #fbe3df; --t2: #c98612; --t2-bg: #fdeed3; --t3: #3c9a68; --t3-bg: #dff1e6;
  --ok: #1d7f47; --ok-bg: #dcf1e4; --low: #2a64a6; --low-bg: #deeaf7; --high: #c0392b; --high-bg: #fbe1dd;
  --f-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --f-body: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 10px; --shadow: 0 1px 2px rgba(20, 35, 55, .06), 0 2px 8px rgba(20, 35, 55, .05);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f151e; --surface: #172130; --surface-2: #1c2737; --line: #2b3a4e; --ink: #e7edf4; --muted: #9babbe;
    --nuit: #24345a; --canard: #3db2bd; --canard-ink: #0b1a1d; --canard-pale: #173a40;
    --t1: #f08a7e; --t1-bg: #3c2422; --t2: #f0b54a; --t2-bg: #3a2f19; --t3: #6cc898; --t3-bg: #183326;
    --ok: #6ad39a; --ok-bg: #173826; --low: #7fb2ec; --low-bg: #1a2c44; --high: #ff8a7a; --high-bg: #44221e;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f151e; --surface: #172130; --surface-2: #1c2737; --line: #2b3a4e; --ink: #e7edf4; --muted: #9babbe;
  --nuit: #24345a; --canard: #3db2bd; --canard-ink: #0b1a1d; --canard-pale: #173a40;
  --t1: #f08a7e; --t1-bg: #3c2422; --t2: #f0b54a; --t2-bg: #3a2f19; --t3: #6cc898; --t3-bg: #183326;
  --ok: #6ad39a; --ok-bg: #173826; --low: #7fb2ec; --low-bg: #1a2c44; --high: #ff8a7a; --high-bg: #44221e;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--f-body); font-size: 15.5px; line-height: 1.45; }
main { max-width: 1100px; margin: 0 auto; padding-inline: 16px; padding-block: 14px 48px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--canard); outline-offset: 2px; }
small { color: var(--muted); font-size: .85em; }
.muted { color: var(--muted); }
.top { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: flex-end; justify-content: space-between; padding-block: 6px 14px; }
.eyebrow { margin: 0; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--canard); font-weight: 700; }
.top h1 { font-family: var(--f-display); font-size: 36px; line-height: 1.05; }
.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 3px; }
.seg button { border: 0; background: none; padding: 9px 16px; border-radius: 8px; font-weight: 700; min-height: 42px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--nuit); color: var(--nuit-ink); }
.h2 { font-family: var(--f-display); font-size: 22px; color: var(--canard); border-bottom: 2px solid var(--canard); padding-bottom: 3px; margin: 26px 0 12px; }
.h3 { font-size: 16px; font-weight: 700; margin: 0 0 6px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 42px; padding: 9px 15px; border-radius: 9px; border: 1.5px solid var(--line); background: var(--surface); font-weight: 600; }
.btn.primary { background: var(--canard); border-color: var(--canard); color: var(--canard-ink); }
.btn.danger { color: var(--high); border-color: var(--high); }
.btns { display: flex; flex-wrap: wrap; gap: 10px; }
.callout { background: var(--canard-pale); border-radius: var(--r); padding: 12px 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; box-shadow: var(--shadow); }
.note { font-size: 14px; color: var(--muted); margin: 8px 0 0; }

/* QR */
.qr-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
.qr-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: flex; flex-direction: column; gap: 8px; text-align: left; box-shadow: var(--shadow); }
.qr-card .hd { display: flex; gap: 10px; align-items: center; }
.tag { min-width: 44px; height: 36px; padding: 0 6px; border-radius: 8px; background: var(--nuit); color: var(--nuit-ink); display: grid; place-items: center; font-family: var(--f-display); font-size: 19px; font-weight: 700; }
.qr-card b { font-size: 15px; line-height: 1.2; }
.qr-img { background: #fff; border-radius: 8px; padding: 10px; }
.qr-img svg { display: block; width: 100%; height: auto; }
.code { font-family: var(--f-display); font-size: 24px; font-weight: 700; letter-spacing: .08em; text-align: center; font-variant-numeric: tabular-nums; }
.full { position: fixed; inset: 0; z-index: 50; background: #ffffff; color: #0d1420; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(16px + env(safe-area-inset-bottom, 0px)); }
.full h2 { font-family: var(--f-display); font-size: clamp(26px, 4vw, 44px); text-align: center; text-transform: uppercase; letter-spacing: .05em; }
.full .sub { margin: -6px 0 0; font-style: italic; color: #4a5768; text-align: center; }
.full .qr-big { width: min(78vw, 62vh, 620px); }
.full .qr-big svg { width: 100%; height: auto; display: block; }
.full .code { font-size: clamp(30px, 5vw, 56px); }
.full .ctrl { display: flex; gap: 10px; }
.full .ctrl button { background: #eef2f5; border: 1px solid #c9d3dd; color: #0d1420; min-height: 48px; min-width: 48px; border-radius: 10px; font-weight: 700; padding: 0 16px; }

/* Classe */
.drop { border: 2px dashed var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 10px; background: var(--surface); }
.drop.over { border-color: var(--canard); background: var(--canard-pale); }
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 14.5px; }
th, td { padding: 9px 10px; border-top: 1px solid var(--line); text-align: left; vertical-align: middle; }
thead th { background: var(--surface-2); border-top: 0; font-size: 12.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); white-space: nowrap; }
tbody tr.row { cursor: pointer; }
tbody tr.row:hover { background: var(--surface-2); }
td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
.name b { display: block; } .name small { white-space: nowrap; }
.dots { display: flex; gap: 3px; }
.dot { width: 18px; height: 22px; border-radius: 4px; background: var(--surface-2); border: 1px solid var(--line); position: relative; overflow: hidden; }
.dot i { position: absolute; left: 0; right: 0; bottom: 0; background: var(--canard); }
.dot.lock { background: repeating-linear-gradient(45deg, var(--surface-2) 0 3px, var(--line) 3px 5px); }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 99px; font-size: 13.5px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.chip.in { background: var(--ok-bg); color: var(--ok); } .chip.low { background: var(--low-bg); color: var(--low); }
.chip.high, .chip.over { background: var(--high-bg); color: var(--high); } .chip.mute { background: var(--surface-2); color: var(--muted); }
.zpill { font-weight: 700; padding: 2px 9px; border-radius: 99px; font-size: 13.5px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.zpill.t1 { background: var(--t1-bg); color: var(--t1); } .zpill.t2 { background: var(--t2-bg); color: var(--t2); } .zpill.t3 { background: var(--t3-bg); color: var(--t3); }
.pct { font-weight: 700; }
.legend-dots { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--muted); margin-top: 8px; align-items: center; }

/* Détail élève */
.back { background: none; border: 0; color: var(--canard); font-weight: 700; padding: 8px 0; min-height: 42px; }
.band { background: var(--nuit); color: var(--nuit-ink); border-radius: var(--r); padding: 14px 18px; display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: baseline; justify-content: space-between; }
.band h2 { font-family: var(--f-display); font-size: 30px; letter-spacing: .03em; }
.band p { margin: 0; opacity: .9; }
.grid2 { display: grid; gap: 12px; }
@media (min-width: 760px) { .grid2 { grid-template-columns: 1fr 1fr; } }
.grid2 > * { min-width: 0; }
.kv { display: grid; grid-template-columns: 150px 1fr; gap: 5px 12px; margin: 0; }
.kv dt { font-weight: 700; } .kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.unit-h { display: flex; gap: 10px; align-items: center; margin: 26px 0 10px; }
.unit-h h3 { font-family: var(--f-display); font-size: 22px; }
.radars { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.radar-svg { width: 100%; height: auto; display: block; }
.rg-ring { fill: none; stroke: var(--line); stroke-width: 1; } .rg-ring.outer { stroke: var(--muted); stroke-opacity: .55; }
.rg-axis { stroke: var(--line); stroke-width: 1; }
.rg-cur { fill: var(--canard); fill-opacity: .22; stroke: var(--canard); stroke-width: 2.5; stroke-linejoin: round; }
.rg-dot { fill: var(--canard); } .rg-cmp { fill: none; stroke: var(--muted); stroke-width: 2; stroke-dasharray: 5 4; }
.rg-lab { fill: var(--ink); font-family: var(--f-body); font-size: 12.5px; font-weight: 700; }
.rg-sub { fill: var(--muted); font-family: var(--f-body); font-size: 11px; }
.quote { background: var(--surface-2); border-left: 4px solid var(--canard); padding: 8px 12px; border-radius: 0 8px 8px 0; margin: 6px 0 0; white-space: pre-wrap; }
.qlab { font-weight: 700; font-size: 14px; margin-top: 10px; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--nuit); color: var(--nuit-ink); padding: 11px 18px; border-radius: 10px; font-weight: 600; z-index: 60; max-width: calc(100% - 32px); text-align: center; }
textarea { width: 100%; background: var(--surface); border: 1.5px solid var(--line); border-radius: 8px; padding: 9px 10px; min-height: 80px; }
details summary { cursor: pointer; font-weight: 700; color: var(--canard); min-height: 32px; display: flex; align-items: center; }
</style>

<div id="toast" class="toast" role="status" hidden></div>

  { k: 'tenue', l: 'Tenue et chaussures lacées, eau' },
  { k: 'step', l: 'Step vérifié, rehausses prêtes, lests éventuels' },
  { k: 'seq', l: 'Séquence (durées) notée et connue' },
  { k: 'fc', l: 'FC repos et zone cible calculées', auto: 'fc' },
  { k: 'afl', l: 'Choix AFL2 / AFL3 fait', auto: 'afl' },
  { k: 'chore', l: 'Chorégraphie mémorisée (D et G)' },
  { k: 'echauf', l: 'Échauffement préparé' }
];

function unitById(id) { return UNITS.find(u => u.id === id); }
function unitIndex(id) { return UNITS.findIndex(u => u.id === id); }

/* ----- utilitaires ----- */
function getP(o, path) { return path.split('.').reduce((a, k) => (a == null ? undefined : a[k]), o); }
function setP(o, path, v) {
  const ks = path.split('.');
  let a = o;
  for (let i = 0; i < ks.length - 1; i++) {
    const k = ks[i];
    if (a[k] == null || typeof a[k] !== 'object') a[k] = /^\d+$/.test(ks[i + 1]) ? [] : {};
    a = a[k];
  }
  a[ks[ks.length - 1]] = v;
}
function num(v) { const n = parseFloat(String(v ?? '').replace(',', '.')); return isFinite(n) ? n : null; }
function filled(v) { return v !== undefined && v !== null && String(v).trim() !== ''; }
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

/* ----- fréquence cardiaque ----- */
function fcCalc(d) {
  const age = num(d?.profil?.age), repos = num(d?.fc?.repos), mes = num(d?.fc?.maxMesuree);
  const sexe = d?.profil?.sexe, base = sexe === 'F' ? 226 : sexe === 'G' ? 220 : null;
  const theo = age && base ? base - age : null;
  const fcmax = mes || theo;
  const ok = !!(repos && fcmax && fcmax > repos);
  return { age, repos, sexe, base, theo, mesuree: mes, fcmax, source: mes ? 'mesurée' : base + ' − âge', fcr: ok ? fcmax - repos : null, ok };
}
function zoneFor(d, theme) {
  const c = fcCalc(d), T = THEMES[theme];
  if (!c.ok || !T) return null;
  return { bas: Math.round(c.repos + c.fcr * T.pmin), haut: Math.round(c.repos + c.fcr * T.pmax) };
}
/* k : in | low | high | over | notheme | nofc | empty */
function fcStatus(d, theme, fc) {
  const v = num(fc);
  if (!v) return { k: 'empty' };
  const c = fcCalc(d);
  if (!c.ok) return { k: 'nofc' };
  const pct = Math.round((v - c.repos) / c.fcr * 100);
  if (v > c.fcmax) return { k: 'over', pct };
  if (!theme || !THEMES[theme]) return { k: 'notheme', pct };
  const z = zoneFor(d, theme);
  if (v < z.bas) return { k: 'low', pct, z };
  if (v > z.haut) return { k: 'high', pct, z };
  return { k: 'in', pct, z };
}
function unitTheme(d, u) {
  const own = d?.seances?.[u.id]?.theme;
  if (filled(own)) return +own;
  if (u.themeMode === 'projet' && filled(d?.projet?.theme)) return +d.projet.theme;
  return null;
}
function sectionTheme(d, u, sec) { return sec.theme || unitTheme(d, u); }

/* ----- séquence ----- */
function seqStats(seq) {
  const rows = (seq || []).filter(r => r && (num(r.eff) || num(r.rec)));
  const eff = rows.reduce((s, r) => s + (num(r.eff) || 0), 0);
  const recs = rows.slice(0, -1).reduce((s, r) => s + (num(r.rec) || 0), 0);
  return { n: rows.length, eff: Math.round(eff * 10) / 10, total: Math.round((eff + recs) * 10) / 10 };
}

/* ----- remplissage ----- */
function unitFields(d, u) {
  const s = d?.seances?.[u.id] || {};
  let tot = 0, ok = 0;
  const add = v => { tot++; if (filled(v)) ok++; };
  if (u.themeMode !== 'aucun' && !u.noDate) add(s.date);
  for (const sec of u.sections) {
    if (sec.t === 'releves') for (const c of sec.cols) { add(s[sec.k]?.[c.k]?.fc); add(s[sec.k]?.[c.k]?.rpe); }
    else if (sec.t === 'radars') for (const r of sec.items) for (const a of RADAR_AXES) add(s[r.k]?.[a.k]);
    else if (sec.t === 'texte' || sec.t === 'choix' || sec.t === 'ouinon') add(s[sec.k]);
    else if (sec.t === 'sequence') add(seqStats(s[sec.k]).n ? 'x' : '');
    else if (sec.t === 'monchoix') { add(d?.projet?.theme); add(d?.projet?.modalite); add(d?.projet?.justif); }
    else if (sec.t === 'dates') { add(s.dateEpreuve); add(s.renduPapier); add(s.renduENT); }
    else if (sec.t === 'checklist') for (const c of CHECKLIST) add(checkDone(d, c) ? 'x' : '');
  }
  return { tot, ok, pct: tot ? Math.round(ok / tot * 100) : 0 };
}
function checkDone(d, c) {
  if (c.auto === 'fc') return fcCalc(d).ok && filled(d?.projet?.theme);
  if (c.auto === 'afl') return filled(d?.profil?.repartition);
  return !!d?.seances?.ep?.check?.[c.k];
}

/* Tous les relevés FC d'un carnet, avec leur statut */
function allReleves(d) {
  const out = [];
  for (const u of UNITS) for (const sec of u.sections) if (sec.t === 'releves') {
    const th = sectionTheme(d, u, sec);
    for (const c of sec.cols) {
      const fc = d?.seances?.[u.id]?.[sec.k]?.[c.k]?.fc;
      if (!filled(fc) || c.noZone) continue;
      out.push({ unit: u.id, col: c.l, fc: num(fc), rpe: d.seances[u.id][sec.k][c.k].rpe, theme: th, st: fcStatus(d, th, fc) });
    }
  }
  return out;
}

/* Radar de référence de la séance 1 (le dernier rempli) */
function radarFilled(r) { return r && RADAR_AXES.some(a => filled(r[a.k])); }
function refRadarS1(d) {
  const s = d?.seances?.s1 || {};
  if (radarFilled(s.rb)) return { r: s.rb, l: 'Séance 1 (après 5 min)' };
  if (radarFilled(s.ra)) return { r: s.ra, l: 'Séance 1 (après 1 min)' };
  return null;
}

/* ----- codes de déverrouillage ----- */
function normCode(s) { return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase().replace(/[^A-Z0-9]/g, ''); }
function fnv(str) {
  let h = 0x811c9dc5;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193); }
  return (h >>> 0).toString(16).padStart(8, '0');
}
function codeHash(code) { return fnv('STEP1E|' + normCode(code)); }

/* ----- radar SVG ----- */
function radarSVG(vals, cmp) {
  const W = 400, H = 270, cx = 200, cy = 136, R = 82;
  const n = RADAR_AXES.length;
  const pt = (i, v) => { const a = -Math.PI / 2 + i * 2 * Math.PI / n; return [cx + Math.cos(a) * R * v / 10, cy + Math.sin(a) * R * v / 10]; };
  let g = '';
  for (const lv of [2, 4, 6, 8, 10]) {
    g += `<polygon points="${RADAR_AXES.map((_, i) => pt(i, lv).join(',')).join(' ')}" class="rg-ring${lv === 10 ? ' outer' : ''}"/>`;
  }
  RADAR_AXES.forEach((_, i) => { const [x, y] = pt(i, 10); g += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" class="rg-axis"/>`; });
  const poly = (v, cls) => {
    if (!radarFilled(v)) return '';
    const pts = RADAR_AXES.map((a, i) => pt(i, num(v[a.k]) || 0));
    return `<polygon points="${pts.map(p => p.join(',')).join(' ')}" class="${cls}"/>` +
      (cls === 'rg-cur' ? pts.map((p, i) => filled(v[RADAR_AXES[i].k]) ? `<circle cx="${p[0]}" cy="${p[1]}" r="3.5" class="rg-dot"/>` : '').join('') : '');
  };
  g += poly(cmp, 'rg-cmp') + poly(vals, 'rg-cur');
  RADAR_AXES.forEach((a, i) => {
    const ang = -Math.PI / 2 + i * 2 * Math.PI / n;
    const lx = cx + Math.cos(ang) * (R + 14), ly = cy + Math.sin(ang) * (R + 14);
    const anchor = Math.abs(Math.cos(ang)) < 0.2 ? 'middle' : (Math.cos(ang) > 0 ? 'start' : 'end');
    const dy = Math.sin(ang) < -0.9 ? -16 : (Math.sin(ang) > 0.9 ? 8 : -2);
    g += `<text x="${lx}" y="${ly + dy}" text-anchor="${anchor}" class="rg-lab">${a.l}</text><text x="${lx}" y="${ly + dy + 13}" text-anchor="${anchor}" class="rg-sub">${a.s}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" class="radar-svg" role="img" aria-label="Radar des ressentis">${g}</svg>`;
}

</script>
<script>
(function () {
  'use strict';
  const CODES_CLEAR = [{"id": "s1", "code": "BASIC-47"}, {"id": "s2", "code": "TEMPO-82"}, {"id": "s3", "code": "VSTEP-31"}, {"id": "s4", "code": "MAMBO-56"}, {"id": "s5", "code": "LUNGE-29"}, {"id": "s6", "code": "JAZZ-73"}, {"id": "s7", "code": "CHEVAL-18"}, {"id": "ep", "code": "KNEEUP-64"}, {"id": "bi", "code": "TAP-90"}];
  const $ = (s, r = document) => r.querySelector(s);
  const viewEl = $('#view');
  let tab = 'qr', detail = null, fullIdx = null, DL = null;
  let CLASSE = []; // [{key, d, exportedAt, file}]

  try { if (window.claude && typeof window.claude.use === 'function') window.claude.use('downloads').then(ns => { DL = ns; }).catch(() => { }); } catch (e) { }

  function toast(m) { const t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => { t.hidden = true; }, 2800); }

  function qrSVG(text) {
    const q = qrcode(0, 'M'); q.addData(text); q.make();
    const n = q.getModuleCount(), m = 2;
    let d = '';
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) d += `M${c + m} ${r + m}h1v1h-1z`;
    return `<svg viewBox="0 0 ${n + 2 * m} ${n + 2 * m}" shape-rendering="crispEdges" role="img" aria-label="QR code ${esc(text)}"><rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="#0d1420"/></svg>`;
  }

  /* ---------- rendu ---------- */
  function render() {
    const head = `<header class="top"><div><p class="eyebrow">Carnet step 1re · CA5</p><h1>Espace prof</h1></div>
      <div class="seg" role="group" aria-label="Sections"><button data-tab="qr" aria-pressed="${tab === 'qr'}">QR des séances</button><button data-tab="classe" aria-pressed="${tab === 'classe'}">Ma classe${CLASSE.length ? ' · ' + CLASSE.length : ''}</button></div></header>`;
    viewEl.innerHTML = head + (tab === 'qr' ? renderQR() : (detail != null ? renderDetail(detail) : renderClasse()));
  }
  function renderQR() {
    return `<p class="callout">Projette ou affiche le QR en début de séance : les élèves le scannent dans l’appli, ou tapent le code écrit dessous. Un QR débloque sa séance et toutes les précédentes, pour que les absents rattrapent. Touche une carte pour l’afficher en plein écran.</p>
      <div class="qr-grid" style="margin-top:14px">${UNITS.map((u, i) => { const c = CODES_CLEAR.find(x => x.id === u.id); return `<button class="qr-card" data-full="${i}"><span class="hd"><span class="tag">${u.tag}</span><b>${esc(u.titre)}</b></span><span class="qr-img">${qrSVG(c.code)}</span><span class="code">${c.code}</span></button>`; }).join('')}</div>
      <p class="note">Pour afficher les QR au mur du gymnase, utilise le PDF imprimable fourni avec l’appli (un QR par page).</p>`;
  }
  function openFull(i) {
    fullIdx = (i + UNITS.length) % UNITS.length;
    const u = UNITS[fullIdx], c = CODES_CLEAR.find(x => x.id === u.id);
    const f = $('#full');
    f.innerHTML = `<h2>${esc(u.titre)}</h2><p class="sub">${esc(u.sous)}</p><div class="qr-big">${qrSVG(c.code)}</div><div class="code">${c.code}</div><div class="ctrl"><button data-fnav="-1" aria-label="QR précédent">‹</button><button data-fclose>Fermer</button><button data-fnav="1" aria-label="QR suivant">›</button></div>`;
    f.hidden = false;
    try { const wl = navigator.wakeLock; if (wl) wl.request('screen').catch(() => { }); } catch (e) { }
  }

  /* ---------- classe : import ---------- */
  function keyOf(d) { return [d.profil?.classe, d.profil?.nom, d.profil?.prenom].map(x => String(x || '').trim().toLowerCase()).join('|'); }
  function addCarnet(obj, file) {
    const d = obj && obj.app === APP_ID ? obj.data : null;
    if (!d) return false;
    const key = keyOf(d), at = obj.exportedAt || '';
    const i = CLASSE.findIndex(x => x.key === key);
    if (i >= 0) { if (at >= CLASSE[i].at) CLASSE[i] = { key, d, at, file }; }
    else CLASSE.push({ key, d, at, file });
    return true;
  }
  function sortClasse() { CLASSE.sort((a, b) => (a.d.profil?.nom || '').localeCompare(b.d.profil?.nom || '', 'fr') || (a.d.profil?.prenom || '').localeCompare(b.d.profil?.prenom || '', 'fr')); }
  async function importFiles(list) {
    let ok = 0, bad = 0;
    for (const f of list) {
      try { const txt = await f.text(); if (addCarnet(JSON.parse(txt), f.name)) ok++; else bad++; } catch (e) { bad++; }
    }
    sortClasse(); render();
    toast(`${ok} carnet${ok > 1 ? 's' : ''} importé${ok > 1 ? 's' : ''}${bad ? ` · ${bad} fichier${bad > 1 ? 's' : ''} ignoré${bad > 1 ? 's' : ''}` : ''}`);
  }
  $('#files').addEventListener('change', e => { importFiles([...e.target.files]); e.target.value = ''; });

  function stats(d) {
    const rel = allReleves(d).filter(r => r.theme);
    const inZ = rel.filter(r => r.st.k === 'in').length;
    const over = rel.filter(r => r.st.k === 'over').length;
    return { n: rel.length, inZ, over, pct: rel.length ? Math.round(inZ / rel.length * 100) : null };
  }
  function renderClasse() {
    const rows = CLASSE.map((x, i) => {
      const d = x.d, p = d.profil || {}, st = stats(d), th = d.projet?.theme, z = th ? zoneFor(d, th) : null;
      const rep = REPARTITIONS.find(r => r.k === p.repartition);
      const dots = UNITS.map(u => { const open = d.unlocked?.[u.id]; const f = open ? unitFields(d, u).pct : 0; return `<span class="dot${open ? '' : ' lock'}" title="${esc(u.titre)} : ${open ? f + ' %' : 'verrouillée'}"><i style="height:${f}%"></i></span>`; }).join('');
      return `<tr class="row" data-detail="${i}" tabindex="0"><td class="name"><b>${esc((p.nom || '').toUpperCase())} ${esc(p.prenom || '')}</b><small>${esc(p.classe || '')}${p.groupe ? ' · gr. ' + esc(p.groupe) : ''}</small></td>
        <td>${th ? `<span class="zpill t${th}">T${th}${z ? ` · ${z.bas}–${z.haut}` : ''}</span>` : '<span class="muted">—</span>'}</td>
        <td><div class="dots">${dots}</div></td>
        <td class="num">${st.n ? `<span class="pct">${st.pct} %</span> <small>(${st.inZ}/${st.n})</small>` : '<span class="muted">—</span>'}${st.over ? ` <span class="chip over" title="Relevés au-delà de la FC max">⚠ ${st.over}</span>` : ''}</td>
        <td class="num">${(d.obs || []).length}</td>
        <td class="num">${rep ? rep.k.replace('-', ' / ') + (p.repartitionLock ? ' 🔒' : '') : '<span class="muted">—</span>'}</td>
        <td class="num"><small>${x.at ? new Date(x.at).toLocaleDateString('fr-FR') : '—'}</small></td></tr>`;
    }).join('');
    const table = CLASSE.length ? `<div class="tbl-wrap"><table><thead><tr><th>Élève</th><th>Thème · zone</th><th>Séances S1→Bilan</th><th>Relevés dans la zone</th><th>Obs.</th><th>AFL2 / AFL3</th><th>Export</th></tr></thead><tbody>${rows}</tbody></table></div>
      <div class="legend-dots"><span class="dots"><span class="dot"><i style="height:60%"></i></span></span> séance ouverte, hauteur = remplissage <span class="dots"><span class="dot lock"></span></span> verrouillée <span>⚠ relevés au-delà de la FC max</span></div>
      <div class="btns" style="margin-top:14px"><button class="btn primary" data-act="csvSynth">Exporter la synthèse (CSV)</button><button class="btn" data-act="csvRel">Exporter tous les relevés (CSV)</button><button class="btn danger" data-act="clear">Vider la liste</button></div>` : '';
    return `<section class="drop" id="drop"><h2 class="h3">Importer les carnets des élèves</h2><p style="margin:0">Récupère sur EcoleDirecte les fichiers <b>.json</b> déposés par les élèves, puis sélectionne-les tous d’un coup (ou glisse-les ici). Si un élève dépose deux fois, la version la plus récente est gardée.</p>
      <div class="btns"><button class="btn primary" data-act="pick">Choisir les fichiers</button>${CLASSE.length ? '' : '<button class="btn" data-act="demo">Charger 3 carnets exemples</button>'}</div>
      <details><summary>Coller un carnet copié en texte</summary><textarea id="paste" placeholder="Colle ici le texte copié depuis l’appli"></textarea><div style="margin-top:8px"><button class="btn" data-act="paste">Ajouter ce carnet</button></div></details></section>
      ${CLASSE.length ? '<h2 class="h2">Ma classe</h2>' + table : '<p class="note">Aucun carnet chargé. Les carnets restent dans cette page tant qu’elle est ouverte : rien n’est envoyé ni enregistré ailleurs.</p>'}
      ${CLASSE.length ? '<p class="note">Les carnets restent dans cette page tant qu’elle est ouverte : rien n’est envoyé ni enregistré ailleurs. Recharger la page vide la liste.</p>' : ''}`;
  }

  /* ---------- détail élève ---------- */
  const CHIP = { in: ['in', '✓ dans la zone'], low: ['low', '↓ sous la zone'], high: ['high', '↑ au-dessus'], over: ['over', '⚠ > FC max'], notheme: ['mute', 'sans thème'], nofc: ['mute', 'profil FC incomplet'] };
  function chip(st) { const c = CHIP[st.k]; return c ? `<span class="chip ${c[0]}">${c[1]}</span>` : ''; }
  function q(label, txt) { return filled(txt) ? `<div class="qlab">${esc(label)}</div><p class="quote">${esc(txt)}</p>` : ''; }
  function renderDetail(i) {
    const x = CLASSE[i]; if (!x) { detail = null; return renderClasse(); }
    const d = x.d, p = d.profil || {}, c = fcCalc(d), th = d.projet?.theme;
    const rep = REPARTITIONS.find(r => r.k === p.repartition);
    let html = `<button class="back" data-back>‹ Ma classe</button>
      <header class="band"><h2>${esc((p.nom || '').toUpperCase())} ${esc(p.prenom || '')}</h2><p>${esc(p.classe || '')}${p.groupe ? ' · groupe ' + esc(p.groupe) : ''}${p.age ? ' · ' + esc(p.age) + ' ans' : ''}</p></header>
      <div class="grid2" style="margin-top:12px">
        <div class="card"><h3 class="h3">Fréquence cardiaque</h3><dl class="kv">
          <dt>FC repos</dt><dd>${c.repos ? c.repos + ' puls/min' : '—'}</dd>
          <dt>FC max</dt><dd>${c.fcmax ? `${c.fcmax} puls/min (${c.source})` : '—'}</dd>
          <dt>FC de réserve</dt><dd>${c.fcr ? c.fcr + ' puls/min' : '—'}</dd>
          ${[1, 2, 3].map(n => { const z = zoneFor(d, n); return `<dt>Zone thème ${n}</dt><dd>${z ? `<span class="zpill t${n}">${z.bas}–${z.haut}</span>` : '—'}</dd>`; }).join('')}
        </dl></div>
        <div class="card"><h3 class="h3">Projet</h3><dl class="kv">
          <dt>Thème choisi</dt><dd>${th ? `Thème ${th} – ${THEMES[th].nom}` : '—'}</dd>
          <dt>Modalité</dt><dd>${d.projet?.modalite === 'groupe' ? 'en groupe' : d.projet?.modalite === 'seul' ? 'seul(e)' : '—'}</dd>
          <dt>Mobiles</dt><dd>${[...(d.projet?.mobiles || []), d.projet?.autre].filter(Boolean).map(esc).join('<br>') || '—'}</dd>
          <dt>AFL2 / AFL3</dt><dd>${rep ? rep.l : '—'}${p.repartitionLock ? ` · 🔒 verrouillé le ${new Date(p.repartitionLock).toLocaleDateString('fr-FR')}` : (rep ? ' · non verrouillé' : '')}</dd>
          <dt>Hors EPS</dt><dd>${esc(p.pratique || '—')}</dd>
        </dl>${q('Justification du thème', d.projet?.justif)}</div>
      </div>`;
    for (const u of UNITS) {
      if (!d.unlocked?.[u.id]) continue;
      const s = d.seances?.[u.id] || {}, f = unitFields(d, u);
      html += `<div class="unit-h"><span class="tag">${u.tag}</span><h3>${esc(u.titre)}</h3><small>${f.pct} % rempli${s.date ? ' · ' + new Date(s.date + 'T12:00').toLocaleDateString('fr-FR') : ''}</small></div>`;
      let body = '';
      for (const sec of u.sections) {
        if (sec.t === 'releves') {
          const t = sectionTheme(d, u, sec);
          const rows = sec.cols.map(col => { const r = s[sec.k]?.[col.k] || {}; const st = col.noZone ? { k: '' } : fcStatus(d, t, r.fc); return `<tr><td>${esc(col.l)}</td><td class="num">${filled(r.fc) ? esc(r.fc) : '—'}</td><td class="num">${st.pct != null ? st.pct + ' %' : '—'}</td><td>${filled(r.fc) ? chip(st) : ''}</td><td class="num">${filled(r.rpe) ? esc(r.rpe) : '—'}</td></tr>`; }).join('');
          body += `<div class="tbl-wrap" style="margin-bottom:10px"><table><thead><tr><th>${esc(sec.titre || 'Relevés')}${t && !/thème/i.test(sec.titre || '') ? ` · thème ${t}` : ''}</th><th>FC</th><th>% FCR</th><th>Statut</th><th>RPE</th></tr></thead><tbody>${rows}</tbody></table></div>`;
        } else if (sec.t === 'radars') {
          const cards = sec.items.filter(r => radarFilled(s[r.k])).map(r => { const ref = u.id === 's1' ? null : refRadarS1(d); return `<div class="card"><div class="qlab" style="margin:0 0 4px">${esc(r.l)}</div>${radarSVG(s[r.k], ref ? ref.r : null)}${ref ? '<p class="note" style="text-align:center;margin:0">pointillés : séance 1</p>' : ''}</div>`; }).join('');
          if (cards) body += `<div class="radars" style="margin-bottom:10px">${cards}</div>`;
        } else if (sec.t === 'texte') body += q(sec.l, s[sec.k]);
        else if (sec.t === 'choix' || sec.t === 'ouinon') body += filled(s[sec.k]) ? `<div class="qlab">${esc(sec.l)} <span class="muted" style="font-weight:500">${esc(s[sec.k])}</span></div>` : '';
        else if (sec.t === 'checks') { const ok = sec.items.filter((_, j) => s[sec.k]?.[j]); body += `<div class="qlab">${esc(sec.l)} <span class="muted" style="font-weight:500">${ok.length ? ok.map(esc).join(', ') : 'rien de coché'}</span></div>`; }
        else if (sec.t === 'params') { const pa = s[sec.k] || {}; const l = [pa.hauteur && `hauteur${pa.reh ? ' (' + esc(pa.reh) + ' rehausse·s)' : ''}`, pa.bras && 'bras hauts', pa.imp && 'impulsions', pa.lests && 'lests', pa.bpmOn && `BPM${pa.bpm ? ' ' + esc(pa.bpm) : ''}`].filter(Boolean); body += `<div class="qlab">${esc(sec.l)} <span class="muted" style="font-weight:500">${l.join(', ') || '—'}</span></div>`; }
        else if (sec.t === 'sequence') {
          const seq = s[sec.k] || [], st = seqStats(seq), t = u.themeMode === 'aucun' ? (th ? +th : null) : unitTheme(d, u);
          if (st.n) {
            const vol = t ? THEMES[t].vol : null;
            body += `<div class="qlab">${esc(sec.l)} — ${String(st.eff).replace('.', ',')} min d’effort${vol ? ` (repère thème ${t} : ${vol[0]}–${vol[1]})` : ''}</div><div class="tbl-wrap" style="margin:6px 0 10px"><table><thead><tr><th>Série</th><th>Effort</th><th>Récup</th><th>Paramètres</th></tr></thead><tbody>${seq.map((r, j) => r && (num(r.eff) || num(r.rec)) ? `<tr><td>${j + 1}</td><td class="num">${esc(r.eff || '—')} min</td><td class="num">${esc(r.rec || '—')} min</td><td>${esc(r.par || '')}</td></tr>` : '').join('')}</tbody></table></div>`;
          }
        } else if (sec.t === 'monchoix') { /* déjà dans « Projet » */ }
        else if (sec.t === 'dates') body += `<div class="qlab">Dates <span class="muted" style="font-weight:500">épreuve ${s.dateEpreuve || '—'} · papier ${s.renduPapier || '—'} · ENT ${s.renduENT || '—'}</span></div>`;
        else if (sec.t === 'checklist') { const n = CHECKLIST.filter(cc => checkDone(d, cc)).length; body += `<div class="qlab">Checklist <span class="muted" style="font-weight:500">${n}/${CHECKLIST.length} cochés</span></div>`; }
      }
      html += body || '<p class="note">Rien de rempli pour l’instant.</p>';
    }
    // Chorégraphie
    const blocs = ['b3', 'b4', 'b5'].map((k, j) => { const b = d.chore?.[k]; const l = (b?.l || []).filter(x => x && filled(x.pas)); return l.length ? `<div class="card"><div class="qlab" style="margin:0 0 4px">Bloc ${j + 3}${b.complexe ? ' · pas complexe ✓' : ''}</div>${l.map(x => `<div>1-8 · ${esc(x.pas)}${x.pied ? ' (' + esc(x.pied) + ')' : ''}${x.note ? ' – ' + esc(x.note) : ''}</div>`).join('')}</div>` : ''; }).join('');
    html += `<h3 class="h2">Chorégraphie inventée</h3>${blocs ? `<div class="radars">${blocs}</div>` : '<p class="note">Aucun bloc écrit.</p>'}`;
    // Observations
    const obs = (d.obs || []).map(o => {
      const rows = (o.series || []).map((sr, j) => { if (!sr || !filled(sr.fc)) return ''; const fc = num(sr.fc), bas = num(o.bas), haut = num(o.haut); const st = bas && haut ? (fc < bas ? 'low' : fc > haut ? 'high' : 'in') : null; return `<tr><td>Série ${j + 1}</td><td class="num">${esc(sr.fc)}</td><td>${st ? chip({ k: st }) : ''}</td><td class="num">${filled(sr.rpe) ? esc(sr.rpe) : '—'}</td><td>${['pied', 'dos', 'desc', 'ench'].filter(k => sr[k]).length}/4</td></tr>`; }).join('');
      return `<div class="card"><div class="qlab" style="margin:0 0 6px">Observe ${esc(o.partenaire || '?')}${o.date ? ' · ' + new Date(o.date + 'T12:00').toLocaleDateString('fr-FR') : ''}${o.theme ? ' · thème ' + esc(o.theme) : ''}${o.bas && o.haut ? ` · zone ${esc(o.bas)}–${esc(o.haut)}` : ''}</div>${rows ? `<div class="tbl-wrap"><table><thead><tr><th>Série</th><th>FC</th><th>Zone</th><th>RPE</th><th>Critères</th></tr></thead><tbody>${rows}</tbody></table></div>` : ''}${q('Conseil', o.conseil)}</div>`;
    }).join('');
    html += `<h3 class="h2">Observations (AFL3)</h3>${obs ? `<div class="grid2">${obs}</div>` : '<p class="note">Aucune fiche d’observation.</p>'}`;
    return html;
  }

  /* ---------- exports CSV ---------- */
  function csv(rows) { return '﻿' + rows.map(r => r.map(v => { const s = String(v ?? ''); return /[";\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(';')).join('\r\n'); }
  function synthRows() {
    const head = ['Nom', 'Prénom', 'Classe', 'Groupe', 'Âge', 'FC repos', 'FC max', 'Thème', 'Zone basse', 'Zone haute', 'Modalité', 'AFL2/AFL3', ...UNITS.map(u => u.tag + ' %'), 'Relevés', 'Dans la zone', '% dans la zone', '> FC max', 'Observations'];
    return [head, ...CLASSE.map(({ d }) => {
      const p = d.profil || {}, c = fcCalc(d), th = d.projet?.theme, z = th ? zoneFor(d, th) : null, st = stats(d);
      return [p.nom, p.prenom, p.classe, p.groupe, p.age, c.repos, c.fcmax, th, z?.bas, z?.haut, d.projet?.modalite, p.repartition, ...UNITS.map(u => d.unlocked?.[u.id] ? unitFields(d, u).pct : ''), st.n, st.inZ, st.pct, st.over, (d.obs || []).length];
    })];
  }
  function relRows() {
    const rows = [['Nom', 'Prénom', 'Classe', 'Séance', 'Moment', 'Thème', 'FC', '% FCR', 'Statut', 'RPE']];
    const lab = { in: 'dans la zone', low: 'sous la zone', high: 'au-dessus', over: 'au-delà FC max', notheme: 'sans thème', nofc: 'profil FC incomplet' };
    for (const { d } of CLASSE) for (const r of allReleves(d)) rows.push([d.profil?.nom, d.profil?.prenom, d.profil?.classe, unitById(r.unit).tag, r.col, r.theme || '', r.fc, r.st.pct ?? '', lab[r.st.k] || '', r.rpe ?? '']);
    return rows;
  }
  async function saveCSV(rows, name) {
    const data = csv(rows);
    if (DL) { try { await DL.save({ filename: name, data }); toast('Fichier enregistré'); return; } catch (e) { if (e && e.code === 'declined') return; } }
    try {
      const url = URL.createObjectURL(new Blob([data], { type: 'text/csv;charset=utf-8' }));
      const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 5000);
      toast('Fichier enregistré dans tes téléchargements');
    } catch (e) { toast('Export impossible dans cette vue.'); }
  }

  /* ---------- carnets exemples ---------- */
  function rnd(seed) { let s = seed; return () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; }; }
  function demoStudent(o) {
    const R = rnd(o.seed);
    const d = { profil: { nom: o.nom, prenom: o.prenom, sexe: o.prenom === 'Kevin' ? 'G' : 'F', classe: '1re B', groupe: o.gr, age: String(o.age), pratique: o.pratique, repartition: o.rep }, fc: { repos: String(o.repos) }, projet: { mobiles: o.mobiles, theme: String(o.theme), modalite: o.mod, justif: o.justif }, unlocked: {}, seances: {}, chore: {}, obs: o.obs || [] };
    const c = fcCalc(d);
    const fcAt = (pct) => String(Math.round(c.repos + c.fcr * pct));
    const radar = (base) => Object.fromEntries(RADAR_AXES.map((a, i) => [a.k, String(Math.max(0, Math.min(10, Math.round(base[i] + (R() * 2 - 1)))))]));
    UNITS.forEach((u, i) => { if (i < o.upto) d.unlocked[u.id] = true; });
    const T = THEMES[o.theme], mid = (T.pmin + T.pmax) / 2;
    const day = n => `2026-11-${String(5 + 7 * n).padStart(2, '0')}`;
    d.seances.s1 = { date: day(0), theme: String(o.theme), r: { a: { fc: String(o.repos + 4), rpe: '0' }, b: { fc: fcAt(0.45 + R() * 0.1), rpe: '3' }, c: { fc: fcAt(mid + (R() - 0.5) * 0.2), rpe: '6' } }, ra: radar([3, 7, 8, 3, 2, 2]), rb: radar([6, 6, 7, 6, 5, 5]), retiens: o.retiens };
    d.seances.s2 = { date: day(1), r1: { a: { fc: fcAt(0.78 + R() * 0.05), rpe: '6' }, b: { fc: fcAt(0.86 + R() * 0.06), rpe: '8' }, c: { fc: fcAt(0.88 + R() * 0.06), rpe: '8' } }, r2: { a: { fc: fcAt(0.72 + R() * 0.06), rpe: '5' }, b: { fc: fcAt(0.75 + R() * 0.08), rpe: '6' }, c: { fc: fcAt(0.78 + R() * 0.09), rpe: '7' } }, ra: radar([8, 5, 6, 8, 7, 8]), rb: radar([6, 7, 6, 6, 6, 6]), param: o.param };
    d.seances.s3 = { date: day(2), r: { a: { fc: fcAt(0.45), rpe: '2' }, b: { fc: fcAt(0.55 + R() * 0.08), rpe: '3' }, c: { fc: fcAt(0.6 + R() * 0.08), rpe: '4' } }, ra: radar([2, 6, 5, 2, 2, 2]), rb: radar([4, 6, 5, 4, 4, 3]) };
    for (const id of ['s4', 's5', 's6']) {
      if (unitIndex(id) >= o.upto) continue;
      d.seances[id] = { date: day(unitIndex(id)), r: { a: { fc: fcAt(mid - 0.1 + R() * 0.1), rpe: '4' }, b: { fc: fcAt(mid + (R() - 0.5) * 0.12), rpe: '6' }, c: { fc: fcAt(mid + (R() - 0.3) * 0.14), rpe: '7' } }, ra: radar([6, 7, 6, 6, 5, 5]), retiens: id === 's4' ? 'Mon bloc tient en 32 temps mais je bloque sur la traversée côté gauche.' : '' };
    }
    if (o.upto > 5) d.seances.s6.seq = o.seq;
    d.chore = o.chore || {};
    return { app: APP_ID, v: APP_VERSION, exportedAt: '2026-12-03T17:40:00.000Z', data: d };
  }
  function demoClasse() {
    return [
      demoStudent({ seed: 11, nom: 'Exemple', prenom: 'Léa', gr: '3', age: 16, repos: 65, theme: 2, rep: '4-4', mod: 'groupe', upto: 4, pratique: 'Handball, 2 h/semaine', mobiles: ['Entretenir ma santé, me sentir mieux', 'Me détendre, gérer mon stress'], justif: 'Au thème 2 j’étais essoufflée mais je pouvais dire une phrase courte : c’est là que je me suis sentie le mieux.', param: 'hauteur', retiens: 'Je mets environ 5 min pour entrer dans ma zone.', chore: { b3: { l: [{ pas: 'V-step', pied: 'D' }, { pas: 'Knee up / genou', pied: 'G' }, { pas: 'Traversée', pied: 'D', note: '+ ½ tour' }], complexe: true } } }),
      demoStudent({ seed: 29, nom: 'Exemple', prenom: 'Kevin', gr: '1', age: 17, repos: 58, theme: 1, rep: '2-6', mod: 'seul', upto: 6, pratique: 'Football, 4 h/semaine', mobiles: ['Améliorer ma condition physique / me dépasser', 'Préparer une autre activité (sport, concours, métier)'], justif: 'Je prépare les tests physiques de la gendarmerie, je veux travailler la puissance aérobie.', param: 'BPM', retiens: 'Ma FC monte très vite, je dois mieux gérer le début.', seq: [{ eff: '3', rec: '3', par: '2 rehausses, bras hauts' }, { eff: '3', rec: '3', par: '2 rehausses, bras hauts' }, { eff: '3', rec: '3', par: '2 rehausses + impulsions' }, { eff: '3', rec: '3', par: '2 rehausses + impulsions' }, { eff: '3', rec: '3', par: '3 rehausses' }, { eff: '3', rec: '', par: '3 rehausses' }], obs: [{ partenaire: 'Sarah', date: '2026-11-26', theme: '3', bas: '135', haut: '153', series: [{ fc: '138', rpe: '3', pied: true, dos: true, desc: true, ench: false }, { fc: '156', rpe: '5', pied: true, dos: false, desc: true, ench: true }, { fc: '147', rpe: '4', pied: true, dos: true, desc: true, ench: true }], conseil: 'Série 2 au-dessus de ta zone : garde les bras bas pendant le bloc 2, ta FC est redescendue en série 3.' }], chore: { b3: { l: [{ pas: 'Run', pied: 'D' }, { pas: 'Cheval', pied: 'D', note: 'en sautant' }, { pas: 'Mambo', pied: 'G' }, { pas: 'Lunge (fente)', pied: 'G' }], complexe: true }, b4: { l: [{ pas: 'L-step', pied: 'G' }, { pas: 'Jazz square', pied: 'D' }], complexe: false } } }),
      demoStudent({ seed: 47, nom: 'Exemple', prenom: 'Sarah', gr: '1', age: 16, repos: 72, theme: 3, rep: '6-2', mod: 'groupe', upto: 5, pratique: 'Aucune', mobiles: ['Me détendre, gérer mon stress'], justif: 'Je veux reprendre une activité sans me faire mal et pouvoir parler pendant l’effort.', param: 'les deux', retiens: 'Je m’essouffle vite au début puis ça va mieux.' })
    ];
  }

  /* ---------- événements ---------- */
  document.addEventListener('click', async e => {
    const t = e.target.closest('[data-tab],[data-full],[data-fnav],[data-fclose],[data-detail],[data-back],[data-act]');
    if (!t) return;
    if (t.dataset.tab) { tab = t.dataset.tab; detail = null; render(); return; }
    if (t.dataset.full != null) { openFull(+t.dataset.full); return; }
    if (t.dataset.fnav) { openFull(fullIdx + +t.dataset.fnav); return; }
    if (t.hasAttribute('data-fclose')) { $('#full').hidden = true; return; }
    if (t.dataset.detail != null) { detail = +t.dataset.detail; render(); window.scrollTo(0, 0); return; }
    if (t.hasAttribute('data-back')) { detail = null; render(); return; }
    const a = t.dataset.act;
    if (a === 'pick') $('#files').click();
    else if (a === 'demo') { demoClasse().forEach(o => addCarnet(o, 'exemple')); sortClasse(); render(); toast('3 carnets exemples chargés'); }
    else if (a === 'paste') { const v = $('#paste').value.trim(); try { if (addCarnet(JSON.parse(v), 'collé')) { sortClasse(); render(); toast('Carnet ajouté'); } else toast('Ce texte n’est pas un carnet step.'); } catch (err) { toast('Ce texte n’est pas un carnet step.'); } }
    else if (a === 'clear') { CLASSE = []; render(); toast('Liste vidée'); }
    else if (a === 'csvSynth') saveCSV(synthRows(), 'carnet-step_synthese.csv');
    else if (a === 'csvRel') saveCSV(relRows(), 'carnet-step_releves.csv');
  });
  document.addEventListener('keydown', e => {
    if (!$('#full').hidden) { if (e.key === 'Escape') $('#full').hidden = true; else if (e.key === 'ArrowRight') openFull(fullIdx + 1); else if (e.key === 'ArrowLeft') openFull(fullIdx - 1); return; }
    const r = e.target.closest && e.target.closest('tr[data-detail]');
    if (r && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); detail = +r.dataset.detail; render(); }
  });
  ['dragenter', 'dragover'].forEach(ev => document.addEventListener(ev, e => { const dz = e.target.closest && e.target.closest('#drop'); if (dz) { e.preventDefault(); dz.classList.add('over'); } }));
  ['dragleave', 'drop'].forEach(ev => document.addEventListener(ev, e => { const dz = e.target.closest && e.target.closest('#drop'); if (dz) { e.preventDefault(); dz.classList.remove('over'); if (ev === 'drop' && e.dataTransfer?.files?.length) importFiles([...e.dataTransfer.files]); } }));
  render();
})();
</script>
